<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Submit a Print Idea</title>
  <link rel="stylesheet" href="style.css" />
  <script>
    const submissionOpen = true; // Toggle prompt submission open/closed

    // 🎨 Filament color availability (set true/false)
    const filamentColors = {
      "Black": true,
      "White": true,
      "Red": false,
      "Blue": true,
      "Green": false,
      "Glow in the Dark": true,
      "Silver": true
    };

    window.onload = () => {
      const formSection = document.getElementById("form-section");
      const closedSection = document.getElementById("closed-section");

      if (submissionOpen) {
        formSection.style.display = "block";
        closedSection.style.display = "none";
        populateColorOptions("filamentColor");
      } else {
        formSection.style.display = "none";
        closedSection.style.display = "block";
      }
    };

    function populateColorOptions(selectId) {
      const select = document.getElementById(selectId);
      Object.entries(filamentColors).forEach(([color, available]) => {
        if (available) {
          const option = document.createElement("option");
          option.value = color;
          option.textContent = color;
          select.appendChild(option);
        }
      });
    }

    // Add or remove color selections (limit 1-3)
    let colorCount = 1; // Minimum 1 color

    function addColorSelection() {
      if (colorCount < 3) {
        colorCount++;
        const colorSelectionContainer = document.getElementById("colorSelections");
        const newColorSelect = document.createElement("div");
        newColorSelect.classList.add("color-select-container");
        newColorSelect.innerHTML = `
          <label for="color${colorCount}">Color ${colorCount}:</label><br />
          <select id="color${colorCount}" name="color${colorCount}">
            <option value="">-- Select color ${colorCount} --</option>
          </select><br />
          <button type="button" class="remove-color-btn" onclick="removeColorSelection(this)">Remove Color ${colorCount}</button>
        `;
        colorSelectionContainer.appendChild(newColorSelect);
        populateColorOptions(`color${colorCount}`);
      }
    }

    function removeColorSelection(button) {
      const colorSelectionContainer = document.getElementById("colorSelections");
      const colorSelect = button.parentNode;
      colorSelectionContainer.removeChild(colorSelect);
      colorCount--;
    }
  </script>
</head>
<body class="fade-in">
  <header>
    <h1 class="glow-text">Custom Print Request</h1>
    <nav>
      <ul>
        <li><a href="index.html" class="glow-link">Home</a></li>
        <li><a href="market.html" class="glow-link">Explore the Market</a></li>
        <li><a href="items.html" class="glow-link">Items</a></li>
        <li><a href="submit.html" class="glow-link">Submit Prompt</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <!-- Section shown when submissions are closed -->
    <section id="closed-section">
      <h2 class="glow-text">Prompt Submissions Closed</h2>
      <p>We're not accepting custom print prompts right now. Check back later at the market!</p>
    </section>

    <!-- Section shown when submissions are open -->
    <section id="form-section" style="display: none;">
      <h2 class="glow-text">Submit Your 3D Print Prompt</h2>
      <form action="submit.php" method="POST" class="submission-form">
        <label for="name">Your Name:</label><br />
        <input type="text" id="name" name="name" required /><br />

        <label for="phone">Your Phone Number:</label><br />
        <input type="tel" id="phone" name="phone" pattern="[0-9+\-\s]{7,15}" required /><br />

        <label for="filamentColor">Preferred Filament Color (Single Color Print):</label><br />
        <select id="filamentColor" name="filamentColor" required>
          <option value="">-- Select a color --</option>
        </select><br />

        <div id="colorSelections">
          <label for="color1">Color 1 (for multi-color, optional):</label><br />
          <select id="color1" name="color1">
            <option value="">-- Select color 1 (e.g. base) --</option>
          </select><br />
        </div>

        <button type="button" onclick="addColorSelection()">Add Color</button><br />

        <label for="prompt">Print Prompt:</label><br />
        <textarea id="prompt" name="prompt" rows="4" required placeholder="e.g., Name tag with base as color 1 and text as color 2"></textarea><br />

        <button type="submit" class="btn-explore">Submit Prompt</button>
      </form>
    </section>
  </main>

  <footer>
    <p>&copy; 2025 Phantom Prints Market | All Rights Reserved</p>
  </footer>
</body>
</html>
