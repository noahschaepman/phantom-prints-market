<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Submit a Print Idea</title>
  <link rel="stylesheet" href="style.css" />
  <script>
    const filamentColors = {
      "Black": true,
      "White": true,
      "Red": false,
      "Blue": true,
      "Green": false,
      "Glow in the Dark": true,
      "Silver": true
    };

    window.onload = () => {
      const formSection = document.getElementById("form-section");
      const closedSection = document.getElementById("closed-section");

      // Show or hide form based on submission status
      if (true) {  // Change this based on whether submission is open or closed
        formSection.style.display = "block";
        closedSection.style.display = "none";
        populateColorOptions("filamentColor");
        populateColorOptions("color1");
        populateColorOptions("color2");
        populateColorOptions("color3");
      } else {
        formSection.style.display = "none";
        closedSection.style.display = "block";
      }
    };

    // Populate color options dynamically
    function populateColorOptions(selectId) {
      const select = document.getElementById(selectId);
      Object.entries(filamentColors).forEach(([color, available]) => {
        if (available) {
          const option = document.createElement("option");
          option.value = color;
          option.textContent = color;
          select.appendChild(option);
        }
      });
    }

    // Handle form submission
    function handleSubmit(event) {
      event.preventDefault();

      const name = document.getElementById('name').value;
      const phone = document.getElementById('phone').value;
      const filamentColor = document.getElementById('filamentColor').value;
      const color1 = document.getElementById('color1').value;
      const color2 = document.getElementById('color2').value;
      const color3 = document.getElementById('color3').value;
      const prompt = document.getElementById('prompt').value;

      // Construct the submission object
      const submission = {
        name,
        phone,
        filamentColor,
        color1,
        color2,
        color3,
        prompt,
        submittedAt: new Date().toLocaleString()
      };

      // Retrieve existing submissions or initialize as empty array
      let submissions = JSON.parse(localStorage.getItem('submissions')) || [];

      // Add new submission
      submissions.push(submission);

      // Save back to localStorage
      localStorage.setItem('submissions', JSON.stringify(submissions));

      // Provide feedback to the user
      alert("Your submission has been saved!");
      document.getElementById("submission-form").reset();
    }
  </script>
</head>
<body class="fade-in">
  <header>
    <h1 class="glow-text">Custom Print Request</h1>
    <nav>
      <ul>
        <li><a href="index.html" class="glow-link">Home</a></li>
        <li><a href="market.html" class="glow-link">Explore the Market</a></li>
        <li><a href="items.html" class="glow-link">Items</a></li>
        <li><a href="submit.html" class="glow-link">Submit Prompt</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <!-- Section shown when submissions are closed -->
    <section id="closed-section">
      <h2 class="glow-text">Prompt Submissions Closed</h2>
      <p>We're not accepting custom print prompts right now. Check back later at the market!</p>
    </section>

    <!-- Section shown when submissions are open -->
    <section id="form-section" style="display: none;">
      <h2 class="glow-text">Submit Your 3D Print Prompt</h2>
      <form id="submission-form" onsubmit="handleSubmit(event)">
        <label for="name">Your Name:</label><br />
        <input type="text" id="name" name="name" required /><br />

        <label for="phone">Your Phone Number:</label><br />
        <input type="tel" id="phone" name="phone" pattern="[0-9+\-\s]{7,15}" required /><br />

        <label for="filamentColor">Preferred Filament Color (Single Color Print):</label><br />
        <select id="filamentColor" name="filamentColor" required>
          <option value="">-- Select a color --</option>
        </select><br />

        <label for="color1">Color 1 (for multi-color, optional):</label><br />
        <select id="color1" name="color1">
          <option value="">-- Select color 1 (e.g. base) --</option>
        </select><br />

        <label for="color2">Color 2 (optional):</label><br />
        <select id="color2" name="color2">
          <option value="">-- Select color 2 (e.g. text/logo) --</option>
        </select><br />

        <label for="color3">Color 3 (optional):</label><br />
        <select id="color3" name="color3">
          <option value="">-- Select color 3 (e.g. extra detail) --</option>
        </select><br />

        <label for="prompt">Print Prompt:</label><br />
        <textarea id="prompt" name="prompt" rows="4" required placeholder="e.g., Name tag with base as color 1 and text as color 2"></textarea><br />

        <button type="submit" class="btn-explore">Submit Prompt</button>
      </form>
    </section>
  </main>

  <footer>
    <p>&copy; 2025 Phantom Prints Market | All Rights Reserved</p>
  </footer>
</body>
</html>
